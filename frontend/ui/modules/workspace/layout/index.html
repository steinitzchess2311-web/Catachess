<template id="workspace-template">
    <div class="workspace-container">
        <aside class="workspace-sidebar">
            <div class="sidebar-header">
                <div class="workspace-section-label">Library</div>
                <nav class="workspace-mode-nav">
                    <button class="mode-btn active" data-mode="private">Private</button>
                    <button class="mode-btn" data-mode="public">Public</button>
                    <button class="mode-btn" data-mode="shared">Shared with me</button>
                    <div class="mode-nav-divider"></div>
                    <button class="mode-btn mode-btn--trash" data-mode="trash">
                        <svg class="mode-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                            <path d="M9 3h6l1 2h5v2H3V5h5l1-2zm1 6h2v9h-2V9zm4 0h2v9h-2V9zM7 9h2v9H7V9z"/>
                        </svg>
                        Recycle
                    </button>
                </nav>
            </div>
            <div class="workspace-search-block">
                <label class="workspace-section-label" for="workspace-search-input">Search</label>
                <div class="workspace-search-row">
                    <input id="workspace-search-input" type="text" placeholder="Search folders / studies">
                    <button id="workspace-search-clear" type="button" aria-label="Clear search">×</button>
                </div>
            </div>
            <nav id="folder-tree" class="folder-tree">
                <!-- Recursive folder tree will be injected here -->
            </nav>
        </aside>
        <main class="workspace-main">
            <header class="main-header">
                <div class="workspace-title-block">
                    <h1 class="workspace-title" id="workspace-title">Private workspace</h1>
                    <div class="breadcrumb" id="breadcrumb">
                        <span class="breadcrumb-item" data-id="root">Root</span>
                    </div>
                </div>
                <div class="workspace-header-actions" aria-label="Workspace actions">
                    <div class="workspace-create-actions">
                        <button class="workspace-action-btn workspace-action-btn--secondary" type="button" data-create-type="folder">
                            <svg class="workspace-action-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                                <path fill="currentColor" d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2Zm1 9H8v-2h3V8h2v3h3v2h-3v3h-2v-3Z"/>
                            </svg>
                            Create folder
                        </button>
                        <button class="workspace-action-btn workspace-action-btn--primary" type="button" data-create-type="study">
                            <svg class="workspace-action-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                                <path fill="currentColor" d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm1 2v14h12V5H6Zm5 3h2v3h3v2h-3v3h-2v-3H8v-2h3V8Z"/>
                            </svg>
                            Create study
                        </button>
                    </div>
                    <div class="view-options">
                        <div id="sort-toggles-container"></div>
                    </div>
                </div>
            </header>
            <div id="test-sign-container"></div>
            <section class="workspace-content-shell">
                <div id="items-grid" class="items-grid">
                    <!-- Items (folders/studies) will be injected here -->
                </div>
            </section>
        </main>
    </div>
</template>

<template id="folder-item-template">
    <article class="grid-item folder-item" data-id="{{id}}">
        <div class="item-icon">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        </div>
        <div class="item-info">
            <span class="item-title">{{title}}</span>
            <span class="item-error"></span>
            <span class="item-meta">{{updated_at}}</span>
        </div>
    </article>
</template>

<template id="study-item-template">
    <article class="grid-item study-item" data-id="{{id}}">
        <div class="item-icon">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 16H6V5h12v14zM8 10h2v7H8v-7zm3-3h2v10h-2V7zm3 6h2v4h-2v-4z"/></svg>
        </div>
        <div class="item-info">
            <span class="item-title">{{title}}</span>
            <span class="item-error"></span>
            <span class="item-meta">{{updated_at}}</span>
        </div>
    </article>
</template>

<template id="create-modal-template">
    <div class="modal-overlay">
        <div class="modal-card window-draggable">
            <div class="modal-header window-focus-target">
                <h3>Create New</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Type</label>
                    <select id="new-type">
                        <option value="folder">Folder</option>
                        <option value="study">Study</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="new-title" placeholder="Enter title" required>
                    <div id="new-title-error" class="form-error"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-text modal-close">Cancel</button>
                <button id="confirm-create" class="btn-primary">Create</button>
            </div>
        </div>
    </div>
</template>

<template id="node-actions-template">
    <div class="modal-overlay">
        <div class="modal-card action-card window-draggable">
            <div class="modal-header window-focus-target">
                <div class="modal-title-group">
                    <h3 class="modal-title"></h3>
                </div>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body action-body">
                <button class="action-btn" data-action="move">Move</button>
                <button class="action-btn" data-action="rename">Rename</button>
                <button class="action-btn danger" data-action="delete">Delete</button>
            </div>
        </div>
    </div>
</template>

<template id="rename-node-template">
    <div class="modal-overlay">
        <div class="modal-card window-draggable">
            <div class="modal-header window-focus-target">
                <h3>Rename</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="rename-title" placeholder="Enter title" required>
                    <div id="rename-title-error" class="form-error"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-text modal-close">Cancel</button>
                <button id="confirm-rename" class="btn-primary">Save</button>
            </div>
        </div>
    </div>
</template>

<template id="move-node-template">
    <div class="modal-overlay">
        <div class="modal-card move-card window-draggable">
            <div class="modal-header window-focus-target">
                <h3>Move To</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Destination</label>
                    <select id="move-destination"></select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-text modal-close">Cancel</button>
                <button id="confirm-move" class="btn-primary">Move</button>
            </div>
        </div>
    </div>
</template>

<template id="delete-confirm-template">
    <div class="modal-overlay">
        <div class="modal-card confirm-card window-draggable">
            <div class="modal-header window-focus-target">
                <h3>Delete Study</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p class="confirm-text">Are you sure you want to delete?</p>
            </div>
            <div class="modal-footer">
                <button class="btn-text modal-close">Cancel</button>
                <button id="confirm-delete" class="btn-danger">Yes</button>
            </div>
        </div>
    </div>
</template>

<template id="move-confirm-template">
    <div class="modal-overlay">
        <div class="modal-card confirm-card window-draggable">
            <div class="modal-header window-focus-target">
                <h3>Move Item</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p class="confirm-text" id="move-confirm-text"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-text modal-close">Cancel</button>
                <button id="confirm-move-modal" class="btn-primary">Yes</button>
            </div>
        </div>
    </div>
</template>
